# Release of AVDTune (issue #4, docs/plans/avdtune.md section 9a): on a tag v*, run the checks, build ZIP and manifest.json, publish them as release assets.
# Tag v0.2.0 = stable, v0.2.0-ea.1 = early access (marked as pre-release). The tag must match the file VERSION and the commit must be on main.
# Only the built-in GITHUB_TOKEN is used (no secrets). The build job can only read; a separate publish job has the write permission and runs no repo code.
# The tag name is never put into a script text: it is read from the environment (TAG) and checked against a strict pattern first.
# Actions are pinned to a commit. Recommended in the repo settings: a tag protection rule (ruleset) for v* so only maintainers can create such tags.
name: release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: The tag has the form vX.Y.Z or vX.Y.Z-ea.N
        shell: powershell
        run: |
          if ($env:TAG -cnotmatch '^v\d+\.\d+\.\d+(-ea\.\d+)?\z') { throw 'The tag is not vX.Y.Z or vX.Y.Z-ea.N.' }

      - name: Keep line endings as committed (the ZIP is byte-identical to the checkout on every machine)
        shell: powershell
        run: git config --global core.autocrlf false

      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The commit is on main
        shell: powershell
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'The tagged commit is not on main. Releases are made from main only.' }

      - name: Checks (Windows PowerShell 5.1, without the GUI smoke test; includes Check-PublicContent)
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          .\Tests\Check-All.ps1

      - name: Build ZIP and manifest.json
        shell: powershell
        run: |
          .\Tools\New-AVDTuneRelease.ps1 -OutDir dist -ExpectTag $env:TAG
          Get-ChildItem dist | Format-Table Name, Length

      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: The tag has the form vX.Y.Z or vX.Y.Z-ea.N
        shell: powershell
        run: |
          if ($env:TAG -cnotmatch '^v\d+\.\d+\.\d+(-ea\.\d+)?\z') { throw 'The tag is not vX.Y.Z or vX.Y.Z-ea.N.' }

      # actions/download-artifact v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-files
          path: dist

      - name: Publish the release assets
        shell: powershell
        run: |
          $version = $env:TAG.Substring(1)
          $notes = (Get-Content dist\manifest.json -Raw | ConvertFrom-Json).Notes
          Set-Content -LiteralPath dist\notes.txt -Value $notes -Encoding UTF8
          $flags = @()
          if ($version.Contains('-')) { $flags += '--prerelease' }
          gh release create $env:TAG "dist\AVDTune-$version.zip" "dist\manifest.json" --title "AVDTune $version" --notes-file dist\notes.txt @flags
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed.' }
